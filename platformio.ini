; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[platformio]
src_dir = .
boards_dir = .
default_envs = m4

[env:m4]
platform = espressif32
board = esp32-s3-devkitc-1-myboard
framework = arduino
monitor_speed = 115200
upload_speed = 460800
platform_packages =
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32#2.0.3

build_unflags =
    -std=gnu++11

build_flags =
    -std=gnu++17
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -I./include
    -I.
    -I./lib
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=0
    -DLOG_LEVEL=4

lib_deps =
    moononournation/GFX Library for Arduino@1.2.8
    lovyan03/LovyanGFX@^1.1.12
    https://github.com/Bodmer/TFT_Touch
    git+https://github.com/ATC-Industries/M4Device.git
    Preferences
    gmag11/QuickEspNow @ ^0.6.2
    gmag11/QuickDebug

board_build.partitions = huge_app.csv
board_build.psram = enabled

monitor_filters = esp32_exception_decoder

[env:left]
extends = env:m4
upload_port = /dev/cu.usbserial-110
monitor_port = /dev/cu.usbserial-110

[env:right]
extends = env:m4
upload_port = /dev/cu.usbserial-210
monitor_port = /dev/cu.usbserial-210